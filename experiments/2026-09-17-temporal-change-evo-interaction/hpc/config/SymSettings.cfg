### MAIN ###
# Global Settings

set SEED 10                       # What value should the random seed be? If seed <= 0, then it is randomly re-chosen.
set DATA_INT 100                  # How frequently, in updates, should data print?
set SYNERGY 5                     # Amount symbiont's returned resources should be multiplied by
set VERTICAL_TRANSMISSION 0     # Value 0 to 1 of probability of symbiont vertically transmitting when host reproduces
set HOST_INT -2                   # Interaction value from -1 to 1 that hosts should have initially, -2 for random
set SYM_INT -2                    # Interaction value from -1 to 1 that symbionts should have initially, -2 for random
set INIT_POP_SIZE -1              # Starting size of the host population, -1 for full starting population
set SYM_LIMIT 1                   # Number of symbiont allowed to infect a single host
set START_MOI 1                   # Ratio of symbionts to hosts that experiment should start with
set UPDATES 10000                  # Number of updates to run before quitting
set RES_DISTRIBUTE 100            # Number of resources to give to each host each update if they are available
set LIMITED_RES_TOTAL -1          # Starting number of total resources available over the entire run, -1 for unlimited
set LIMITED_RES_INFLOW 0          # Number of resources to add to the total every update, only used if LIMITED_RES_TOTAL is not -1
set HORIZ_TRANS 1                 # Should non-lytic horizontal transmission occur? 0 for no, 1 for yes
set HOST_REPRO_RES 1000           # How many resources required for host reproduction
set SYM_HORIZ_TRANS_RES 100       # How many resources required for symbiont non-lytic horizontal transmission
set SYM_VERT_TRANS_RES 0          # How many resources required for symbiont vertical transmission
set SYM_INFECTION_CHANCE 1        # The chance (between 0 and 1) that a sym will infect a parallel host on process
set SYM_INFECTION_FAILURE_RATE 0  # The chance (between 0 and 1) that a sym will be killed by the world while trying to infect a host
set HOST_AGE_MAX 500              # The maximum number of updates hosts are allowed to live, -1 for infinite
set SYM_AGE_MAX -1                # The maximum updates symbionts are allowed to live, -1 for infinite
set NO_MUT_UPDATES 0              # How many updates should be run after the end of UPDATES with all mutation turned off?
set PHAGE_EXCLUDE 0               # Do symbionts have a decreasing chance of getting into the host the more symbionts are already infecting it? (0 for no, 1 for yes)
set OUSTING 1                     # Should ousting (incoming symbiont kills and replaces existing symbiont) be turned on? (0 for no, 1 for yes)
set FREE_HT_FAILURE 0             # Should failing to infect a host with horizontally transmitted offspring on the basis of the host already being full cost the parent symbiont any points? (0 for trying and failing still costs, 1 for free failure)
set WRITE_ORG_DUMP_FILE 0         # Should all end-of-experiment organisms pairs be written (with their behavior values and reproduction counts) to a data file? (0 for no, 1 for yes)
set DOMINANT_COUNT 10             # Number of dominant hosts to select
set FILE_PATH output/                # Output file path
set FILE_NAME _data               # Root output file name
set CURE 0                        # Should all symbionts die (0 for no, 1 for yes)
set CURE_UPDATES 0                # How many updates should run before all symbionts die, will take the next update for effect

### SPATIAL_STRUCTURE ###
# Spatial structure settings

set SPATIAL_STRUCT_MODE well-mixed              # Options: well-mixed, grid, load (requires filepath in LoadFile param)
set SPATIAL_STRUCT_CFG_PATH spatial-struct.mat  # Path to the file containing the spatial structure
set SPATIAL_STRUCT_LOAD_MODE matrix             # Expected file format for loaded spatial structure. Options: matrix, edges
set WORLD_WIDTH 100                             # Used for grid and well-mixed modes. Width of the world, just multiplied by the height to get total size
set WORLD_HEIGHT 100                            # Used for grid and well-mixed modes. Height of world, just multiplied by width to get total size

### PHYLOGENY_GROUP ###
# PHYLOGENY

set PHYLOGENY 0                                    # Should the world keep track of host and symbiont phylogenies? (0 for no, 1 for yes)
set TRACK_PHYLOGENY_INTERACTIONS 0                 # Should the world keep track of interactions between hosts and symbionts, then write the count of all (including historical) interactions committed by tracked taxa? (0 for no, 1 for yes)?
set WRITE_CURRENT_INTERACTION_COUNTS 0             # Should the world write the count of only-currently-present interactions? (0 for no, 1 for yes)
set PHYLOGENY_SNAPSHOT_INTERVAL 10001              # How often to output phylogeny snapshots
set NUM_PHYLO_BINS 5                               # How many bins should organisms be separated into if phylogeny is on?
set PHYLOGENY_TAXON_TYPE interaction-value-binned  # What are phylogeny taxa based on? Options: interaction-value-binned, interaction-value-exact, tag, individual
set STORE_EXTINCT 0                                # Should extinct taxa be stored? (0 for no, 1 for yes)

### MUTATION ###
# Mutation

set MUTATION_SIZE 0.002                  # Standard deviation of the distribution to mutate by
set HOST_MUTATION_SIZE -1                # Standard deviation of the distribution to mutate by for hosts, if -1 MUTATION_SIZE used
set MUTATION_RATE 1                      # Value 0 to 1 of probability of mutation
set HOST_MUTATION_RATE -1                # Value 0 to 1 of probability of mutation for hosts, if -1 MUTATION_RATE used
set MUTATE_LYSIS_CHANCE 0                # Should the chance of lysis mutate? 0 for no, 1 for yes
set MUTATE_INDUCTION_CHANCE 0            # Should the chance of Induction mutate? 0 for no, 1 for yes
set MUTATE_INC_VAL 0                     # Whether the incorporation vals mutate or not, 0 or 1
set EFFICIENCY_MUT_RATE -1               # The overall mutation rate of the efficiency trait in symbionts, -1 makes it same as mutation rate as determined by transmission mode
set INT_VAL_MUT_RATE -1                  # The overall mutation rate of the interaction value trait in symbionts, -1 makes it same as mutation rate as determined by transmission mode
set HORIZ_MUTATION_SIZE -1               # Standard deviation of the distribution to mutate by for horizontal transmission, if -1 MUTATION_SIZE used
set HORIZ_MUTATION_RATE -1               # Value 0 to 1 of probability of mutation for horizontal transmission, if -1 MUTATION_RATE used
set SYM_WITHIN_LIFETIME_MUTATION_RATE 0  # Value 0 to 1 of probability of mutation for symbiont every time step

### ECTOSYMBIOSIS_GROUP ###
# Settings for ectosymbiosis and free-living symbionts

set FREE_LIVING_SYMS 0         # Are symbionts able to live outside of the host?
set MOVE_FREE_SYMS 0           # Should the free living syms move around in the world? 0 for no, 1 for yes
set ECTOSYMBIOSIS 0            # Do free-living syms and parallel hosts interact? (0 for no, 1 for yes)
set ECTOSYMBIOTIC_IMMUNITY 0   # Does a hosted sym confer immunity to ectosymbiosis? (0 for no, 1 for yes)
set FREE_SYM_RES_DISTRIBUTE 0  # Number of resources to give to each free-living symbiont each update if they are available
set FREE_SYM_REPRO_RES -1      # How many resources required for free living symbiont reproduction. If -1, use the horizontal transmission required point value.

### TAG_MATCHING_GROUP ###
# Settings for tag matching

set TAG_MATCHING 0                               # Should organisms have tags that they use to decide whether symbionts can infect hosts?
set TAG_METRIC hamming                           # Which tag matching metric should be used to compute distances between tags? hamming [proportion of bits mismatching], streak [ratio of continuously matching/mismatching bits], or hash [arbitrary but consistent difference]
set NORMALIZE_TAG_DISTANCES 0                    # Should distances between pairs of tags be uniformicated? (0 for no, 1 for yes)
set TAG_PERMISSIVENESS 0.125                     # What is the Poisson mean for divergence allowed between tags for a successful infection? (1 = perfect mismatch, 0 = perfect match)
set HOST_TAG_PERMISSIVENESS_EVOLVES 0            # Should each host have a tag permissiveness that evolves as hosts reproduce? If yes, starting tag permissiveness values will be set to the TAG_PERMISSIVENESS config option. (0 for no, 1 for yes)
set HOST_TAG_PERMISSIVENESS_MUTATION_SIZE 0.005  # Standard deviation of the distribution to mutate by for host tag permissiveness values
set HOST_TAG_PERMISSIVENESS_MUTATION_RATE -1     # Value 0 to 1 of probability of mutation for host tag permissiveness, if - 1 HOST_MUTATION_RATE is used (if HOST_MUTATION_RATE is -1, MUTATION_RATE is used)
set TAG_MUTATION_SIZE 0.01                       # What is the probability that any given position in the bitstring tag flips during mutation?
set WRITE_TAG_MATRIX 0                           # At the end of the experiment, should a similarity matrix of all persisting tags be generated?
set TAG_MATRIX_SAMPLE_PROPORTION 0.1             # What proportion of positions in the world should be sampled to produce the tag matrix from?
set HOST_STARTING_TAGS_ONE_PROB 0                # What probability should initializing bits in tags have of being 1s? Hosted symbionts will be assigned their host's tag. (0 for basic, all-0 only tags)

### SGP ###
# Complex Genomes Settings

set CYCLES_PER_UPDATE 16                               # Number of CPU cycles that organisms run every update
set FIND_NEIGHBOR_HOST_ATTEMPTS 5                      # How many times to attempt finding a neighboring host for symbiont to horizontally transmit into
set DONATION_STEAL_INST 0                              # 1 if you want donate and steal instructions in the instruction set, 0 if not
set SYM_DONATE_PROP 0                                  # Proportion of points for sym to donate to host on donate
set SYM_STEAL_PROP 0                                   # Proportion of points for sym to steal from host on steal
set HOST_MIN_CYCLES_BEFORE_REPRO 0                     # Number of CPU cycles organisms must wait between reproductions
set SYM_MIN_CYCLES_BEFORE_REPRO 0                      # Number of CPU cycles organisms must wait between reproductions
set INTERACTION_MECHANISM default                      # What sgp organisms should population the world? (Options: 'default')
set VT_TASK_MATCH 0                                    # Should task matching be required for vertical transmission? (0 for no, 1 for yes)
set TASK_PROFILE_MODE self-all                         # What should we use for task profiles for host-symbiont compatibility, preferential ousting, etc.? Options are parent-all, self-all, self-first, parent-first. 'all' means all tasks, 'first' means only first task performed.
set TASK_PROFILE_COMPATIBILITY_MODE always             # How is compatibility determined for task profiles? always, task-any-match, task-perfect-match
set HORIZONTAL_TRANSMISSION_COMPATIBILITY_MODE always  # How is compatibility determined for horizontal transmission? Relies on TASK_PROFILE_COMPATIBILITY_MODE being set appropriately. Options are: always, task-profile-compatible, task-profile-strictly-stronger-match, task-profile-stronger-or-equal-match

### SGP_MUTATION ###
# SGP mutation group

set SGP_MUT_PER_BIT_RATE 0.005  # Per-bit mutation rate for sgp programs

### CUSTOM_PROGRAM ###
# Custom Program Settings

set HOST_PROGRAM_PATH Default-Config-jsons/NandProgram100.json  # Json file that provides hosts a custom starting program
set SYM_PROGRAM_PATH Default-Config-jsons/NandProgram100.json   # Json file that provides symbionts a custom starting program

### STRESS ###
# Stress Settings

set ENABLE_STRESS 0                                 # Stress interactions enabled?
set STRESS_TYPE mutualist                           # What kind of stress symbionts should be incorporated in stressful environments? (Options: 'mutualist', 'parasite', 'neutral')
set STRESS_FREQUENCY 300                            # How often should stress events occur (in updates)?
set PARASITE_DEATH_CHANCE 0.75                      # What death chance does a parasite confer?
set MUTUALIST_DEATH_CHANCE 0                        # What death chance does a mutualist confer?
set BASE_DEATH_CHANCE 0.75                          # What death chance does a host have in the absence of symbionts?
set PARASITE_NUM_OFFSPRING_ON_STRESS_INTERACTION 8  # Number of offspring stress parasite can produce when host dies during stress event
set PARASITE_ESCAPEE_TIMING on-match-host-death     # When should parasites have the opportunity to produce escapees during a stress event? Options: on-match-host-death, on-match

### HEALTH ###
# Health interaction settings

set ENABLE_HEALTH 0                      # Health interactions enabled?
set HEALTH_TYPE mutualist                # What kind of health symbionts are used?
set MUTUALIST_CYCLE_GAIN_PROP 0.75       # Proportion of cycles gained when host has health mutualist (1.0 = gain additional 100% of base cycles)
set MUTUALIST_CYCLE_DONATE_MULTIPLIER 4  # Multiply cycles donated by symbiont by this value
set PARASITE_CYCLE_LOSS_PROP 0.75        # Proportion of cycles lost when host has health parasite
set PARASITE_CYCLE_STEAL_MULTIPLIER 4    # Parasite gained cycles = (host cycles * parasite cycle loss prop) * multiplier
set PARASITE_BASE_CYCLE_PROP 0.5         # Proportion of CYCLES_PER_UPDATE that parasite gets no matter what. Can steal more by interacting with host.
set HEALTH_INTERACTION_CHANCE 1          # Probability of host-symbiont health interaction each update

### NUTRIENT ###
# Nutrient interaction settings

set ENABLE_NUTRIENT 0                  # Nutrient interactions enabled?
set NUTRIENT_TYPE mutualist            # What kind of nutrient symbionts are used?
set NUTRIENT_DONATE_PROP 0.75          # When symbiont donates resources to a host, what proportion is donated?
set NUTRIENT_STEAL_PROP 0.95           # When symbiont steals resources from a host, what proportion is stolen?
set NUTRIENT_INTERACTION_MULTIPLIER 4  # Multiplier to apply to gain amount
set PARASITE_BASE_TASK_VALUE_PROP 0.5  # Proportion of task value (defined by environment) that parasites receive when they fail to interact with their host.

### TASK_ENVIRONMENT ###
# Task environment settings

set TASK_ENV_CFG_PATH Default-Config-jsons/diff-reward-env.json  # Json file that provides environment configuration
set TASK_IO_BANK_SIZE 100000                                     # How many possible task input/output combinations to pre-generate?
set TASK_IO_UNIQUE_OUTPUT 1                                      # Should each output in the pregenerated io combinations be unique?
set HOST_ONLY_FIRST_TASK_CREDIT 0                                # Only give host credit for one task (whatever they do first)?
set SYM_ONLY_FIRST_TASK_CREDIT 0                                 # Only give sym credit for one task (whatever they do first)?

### EVENTS ###
# Events settings

set EVENTS_CFG_PATH events.json  # JSON file that provides event configuration

### INSTRUCTIONS ###
# Instruction settings

set INCLUDE_INSTRUCTION_SenseTask 0  # Should sense task instruction be included in the instruction set?

### DATA ###
# Data settings

set PRINT_INTERVAL 1  # How often to print run status

